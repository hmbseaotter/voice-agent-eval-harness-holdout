  - id: HF-30
    call_ref: CALL-16
    owner: agent
    observation: >-
      The irreversible transfer was executed before the caller was asked to
      approve it. The write completed and was announced, and only then did the
      agent ask whether the caller was happy for it to go ahead, a question
      that implies the transfer had not yet happened.
    evidence:
      - >-
        event 13 — t2 transfer_booking(booking="BK-6689-JX",
        to="e.nnamdi@example.com")
      - >-
        event 14 — "t2 -> completed successful=true :: transfer_id=TR-9915;
        reversible=false"
      - >-
        event 15 — "That's transferred across to him."
      - >-
        event 16 — "Just to confirm — you're happy for that to go ahead?"
    consequence: >-
      The caller's consent could not have changed anything; a refusal would
      have arrived after the ticket had gone.
    detectable_by: assert
    tier: defect

  - id: HF-31
    call_ref: CALL-16
    owner: platform
    observation: >-
      The context carries a holder-confirmed flag that was false when the
      write completed and is never set true afterwards, although the platform
      updates identity verification the same way earlier in the call.
    evidence:
      - >-
        context — holder_confirmed := false
      - >-
        event 9 — "identity_verified := true"
      - >-
        event 17 — "Yes, that's what I asked for."
      - >-
        No STATE between events 14 and 26.
    consequence: >-
      The record shows an irreversible transfer made against an unconfirmed
      holder, with nothing to say the caller ever agreed.
    detectable_by: assert
    tier: defect

  - id: HF-32
    call_ref: CALL-16
    owner: agent
    observation: >-
      The clause that permits the transfer was fetched and applied after the
      transfer had already completed. The write ran at event 13 and returned
      an irreversible completion at 14; the policy fetch is at 18, the 24-hour
      transfer window at 20, and the agent's "you're well inside the window
      for it" at 21. Nothing established that the transfer was permitted
      before it was made.
    evidence:
      - >-
        event 13 — t2 transfer_booking(booking="BK-6689-JX",
        to="e.nnamdi@example.com")
      - >-
        event 18 — t3 fetch_policy(document="transfer.v1")
      - >-
        event 20 — "Transfers are permitted up to 24 hours before the
        scheduled door time."
      - >-
        event 21 — "And you're well inside the window for it, so that's all
        fine."
    consequence: >-
      The check that should have gated the action was run only after the
      action could not be undone.
    detectable_by: assert
    tier: defect

  - id: HF-33
    call_ref: CALL-16
    owner: agent
    observation: >-
      The recipient's email address was taken from one spoken turn and never
      read back or spelled before an irreversible write. The platform recorded
      the address and the transfer followed within seconds, where a
      one-character name change in CALL-15 was spelled back before its write.
    evidence:
      - >-
        event 10 — "His name's Emeka Nnamdi, and his email is
        e.nnamdi@example.com."
      - >-
        event 12 — "transfer_target_email := e.nnamdi@example.com"
      - >-
        event 13 — t2 transfer_booking(booking="BK-6689-JX",
        to="e.nnamdi@example.com")
      - >-
        CALL-15 event 15 — Can I read it back? K, R-A-V-E-N-S-B-O-U-R-N.
    consequence: >-
      A misheard address sends the ticket to a stranger, and the result says
      it cannot be reversed.
    detectable_by: assert
    tier: defect

  - id: HF-34
    call_ref: CALL-16
    owner: agent
    observation: >-
      The caller was never told the transfer cannot be reversed, although the
