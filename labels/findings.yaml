    tier: question

  - id: HF-18
    call_ref: CALL-14
    owner: agent
    observation: >-
      No eligibility read preceded the refund. `check_refund_eligibility` is
      one of the eighteen tools the entity register declares, and the event
      model states the chain a write is expected to follow: a read establishes
      eligibility, the write is attempted, and the result confirms it. This
      call runs from the policy fetch straight to `issue_refund`, so nothing
      established that this booking was refundable, or for how much, before
      the money moved; the agent's reading of a clause stood in for it.
      Whether the read is required for a promoter cancellation cannot be
      settled from the transcript.
    evidence:
      - >-
        event 10 — t2 fetch_policy(document="refund.v1")
      - >-
        event 16 — t3 issue_refund(booking="BK-7731-DC", amount="44.00")
      - >-
        No TOOL_CALL between events 11 and 16.
    consequence: >-
      The amount rests on the agent's reading of a clause rather than on a
      system's answer.
    detectable_by: assert
    tier: question

  - id: HF-19
    call_ref: CALL-14
    owner: platform
    observation: >-
      No state event records the refund after the write completed. The
      platform writes a state event when identity is verified, and writes none
      for the money it moved, so nothing in the record carries the refund
      forward.
    evidence:
      - >-
        event 9 — "identity_verified := true"
      - >-
        event 17 — "t3 -> completed successful=true :: refund_id=RF-31022"
      - >-
        No STATE between events 17 and 23.
    consequence: >-
      The refund exists in one tool result and nowhere else in the call's
      state.
    detectable_by: assert
    tier: defect

