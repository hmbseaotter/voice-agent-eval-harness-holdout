  - id: HF-21
    call_ref: CALL-15
    owner: agent
    observation: >-
      The agent told the caller that no deadline attaches to the correction,
      which the caller had not asked about and the cited clause does not say.
      The clause makes a correction of two characters or fewer not a transfer,
      so the transfer window does not reach it; it does not say a correction
      has no deadline, and none of the document's other nine clauses was
      cited.
    evidence:
      - >-
        event 13 — "t2 -> retrieved successful=true :: transfer.v1 returned;
        10 clauses"
      - >-
        event 14 — "A name change requires the corrected spelling only."
      - >-
        event 15 — "so it stays a correction rather than a transfer — no
        deadline attached to it"
    consequence: >-
      A timing assurance was given that no retrieved clause supports.
    detectable_by: judge
    tier: question

  - id: HF-22
    call_ref: CALL-15
    owner: agent
    observation: >-
      The agent read the account holder's name to the caller before the caller
      had given it. The name is a context value, the caller had said only that
      the booking's name was misspelled, and the agent spelled out the correct
      version first.
    evidence:
      - >-
        context — account_holder_name := K. Ravensbourne
      - >-
        event 4 — "the name on my booking is spelled wrong and I'd like it
        corrected before the show"
      - >-
        event 10 — "I have it as K. Ravensbourne — what should it say?"
    consequence: >-
      A value that could later serve to confirm a caller's identity was given
      away to whoever was on the line.
    detectable_by: assert
    tier: defect

  - id: HF-23
    call_ref: CALL-15
    owner: agent
    observation: >-
      The agent read out the email address on file and invited the caller to
