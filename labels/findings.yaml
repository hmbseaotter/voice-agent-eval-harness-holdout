    tier: defect

  - id: HF-35
    call_ref: CALL-16
    owner: platform
    observation: >-
      No disclosure event records an irreversibility statement, and no context
      variable records one as owed or delivered, although the result reports
      the transfer as irreversible. Whether such a disclosure is mandated
      cannot be settled from the transcript.
    evidence:
      - >-
        event 14 — "reversible=false"
      - >-
        No DISCLOSURE between events 2 and 26.
    consequence: >-
      Nothing in the record says whether a mandated statement was skipped or
      never applied.
    detectable_by: assert
    tier: question

  - id: HF-36
    call_ref: CALL-16
    owner: agent
    observation: >-
      The agent told the caller the recipient would be emailed, and nothing in
      the record sends anything. No send tool is invoked, and the transfer
      result says nothing about a notification. The agent also raised it only
      after the caller asked.
    evidence:
      - >-
        event 22 — "Great. Will he get an email?"
      - >-
        event 23 — "He will, to the address you gave me."
      - >-
        No TOOL_CALL between events 20 and 26.
    consequence: >-
      If no message goes out, the recipient holds a ticket he does not know
      about.
    detectable_by: assert
    tier: defect

  - id: HF-37
    call_ref: CALL-16
    owner: platform
    observation: >-
      The system ended the call. The agent's closing turn finishes and the
      lifecycle event records an agent hangup more than thirty seconds later,
      with nothing recorded in between, where every other call in this set
      ends on the caller.
    evidence:
      - >-
        event 25 — "No problem. Goodbye."
      - >-
        events 25 to 26 — the gap runs from 1:07.025 to 1:42.415
      - >-
        call record — disconnection_reason: agent_hangup
      - >-
        No event of any kind between events 25 and 26.
    consequence: >-
      The caller was disconnected by the system after a silence nothing
      explains.
    detectable_by: assert
    tier: defect

  - id: HF-38
    call_ref: CALL-16
    owner: platform
    observation: >-
      No state event records that the booking changed hands, or that the
      change cannot be undone. The platform recorded the transfer target
      before the write and recorded nothing after it.
    evidence:
      - >-
        event 11 — "transfer_target_name := E. Nnamdi"
      - >-
        event 14 — "t2 -> completed successful=true :: transfer_id=TR-9915;
        reversible=false"
      - >-
        No STATE between events 14 and 26.
    consequence: >-
      The call's own record still describes the caller as the holder of a
      ticket they no longer have.
    detectable_by: assert
    tier: defect

  - id: HF-39
    call_ref: CALL-16
    owner: platform
    observation: >-
      The whole authorization for an irreversible transfer is one
      caller-supplied ZIP code, checked against an account the platform
      matched on the calling number, with the holder-confirmed flag false at
      the time of the write.
    evidence:
      - >-
        context — matched_by := caller_ani
      - >-
        context — holder_confirmed := false
      - >-
        event 6 — "00337."
      - >-
        event 13 — t2 transfer_booking(booking="BK-6689-JX",
        to="e.nnamdi@example.com")
    consequence: >-
      A ticket can be moved permanently off an account by anyone who knows its
      ZIP.
    detectable_by: human
    tier: question

  - id: HF-40
    call_ref: CALL-17
    owner: agent
    observation: >-
      The agent turned a sent state into an arrival. The context records the
      delivery state as sent, and the agent said it would therefore be in the
      caller's inbox, then that it had definitely gone, after the caller had
      reported that it was not there.
    evidence:
      - >-
        context — delivery_state := sent
      - >-
        event 10 — "It's showing as sent on our side, so it will be in your
        inbox."
      - >-
        event 11 — "I have looked. Three times. It isn't there."
      - >-
        event 12 — "The system says sent, so it has definitely gone."
    consequence: >-
      The one line of inquiry that could have found the ticket was closed off.
    detectable_by: assert
    tier: defect

  - id: HF-41
    call_ref: CALL-17
    owner: agent
    observation: >-
      The agent misquoted its own record. It invoked the record as its
      authority and said the record showed the ticket delivered; the context
      says sent, and no value anywhere in the call says delivered.
    evidence:
      - >-
        context — delivery_state := sent
      - >-
        event 14 — "I can only go on what the record shows, and the record
        shows it was delivered."
    consequence: >-
      The caller was told, falsely, that the system had confirmed delivery.
    detectable_by: assert
    tier: defect

  - id: HF-42
    call_ref: CALL-17
    owner: agent
    observation: >-
      Three delivery attempts sat in the context for the whole call and were
      never mentioned, asked about, or acted on. Three attempts alongside a
      sent state is a signal that delivery was not straightforward, and the
      agent spoke only of the state.
    evidence:
      - >-
        context — delivery_attempts := 3
      - >-
        context — delivery_state := sent
      - >-
        event 10 — "It's showing as sent on our side, so it will be in your
        inbox."
    consequence: >-
      The caller heard a confident account of a delivery the record itself
      shows as troubled.
    detectable_by: judge
    tier: defect

  - id: HF-43
    call_ref: CALL-17
    owner: agent
    observation: >-
      Nothing was attempted. After the verification call, no tool of any kind
      runs for the rest of the call, although a confirmation could have been
      resent, the booking looked up, or the problem escalated, and CALL-15
      shows a confirmation being sent with one call.
    evidence:
      - >-
        No TOOL_CALL between events 9 and 20.
      - >-
        event 16 — "Keep an eye on your inbox over the next day or two."
      - >-
        CALL-15 event 21 — t4 send_confirmation(booking="BK-5540-PW",
        to="k.ravensbourne@example.com")
    consequence: >-
      The caller's daughter may have no ticket at the door, with a remedy one
      call away untried.
    detectable_by: assert
    tier: defect

  - id: HF-44
    call_ref: CALL-17
    owner: agent
    observation: >-
      The delivery address was never confirmed. The account email is in the
      context, the caller said they had checked three times, and the agent
      never read the address back or asked which inbox had been searched,
      which is the question that separates a wrong address from a junk folder.
    evidence:
      - >-
        context — account_email := r.castellan@example.com
      - >-
        event 11 — "I have looked. Three times. It isn't there."
      - >-
        event 10 — "Have a look in your junk folder."
    consequence: >-
      A ticket sent to the wrong address would look exactly like this call,
      and nothing in it would find out.
    detectable_by: judge
    tier: defect

  - id: HF-45
    call_ref: CALL-17
    owner: agent
    observation: >-
      The advice ignored the door time. The context puts doors about
      thirty-one hours after the call, the caller had already said the show
      was the following night, and the agent advised waiting a day or two,
      then answered the caller's correction by moving to close the call.
    evidence:
      - >-
        context — door_time := 2027-04-11T19:00:00Z
      - >-
        event 16 — "Keep an eye on your inbox over the next day or two."
      - >-
        event 17 — "The show is tomorrow. That's less than a day."
      - >-
        event 18 — "Is there anything else I can help you with?"
    consequence: >-
      The remedy offered cannot arrive before the event it was meant to save.
    detectable_by: assert
    tier: defect

  - id: HF-46
    call_ref: CALL-17
    owner: agent
    observation: >-
      Distress and every objection went unanswered, and the call was never
      closed. The caller opened by saying they were running out of time; each
      objection was met with a restatement of the record or a move to close;
      and after the caller's final answer the agent said nothing at all.
    evidence:
      - >-
        event 4 — "She has been looking forward to this for four months and I
        am running out of time to fix it."
      - >-
        event 13 — "Then something is wrong at your end, surely?"
      - >-
        event 18 — "Is there anything else I can help you with?"
      - >-
        event 19 — "No."
    consequence: >-
      The caller left the call with no apology, no next step and no farewell.
    detectable_by: judge
    tier: defect

  - id: HF-47
    call_ref: CALL-17
    owner: platform
    observation: >-
      The call's disposition reports a resolved call whose reason was
      information provided. No tool acted on the problem, the caller's need
      was not met, and the call ended on a refusal and a hang-up.
    evidence:
      - >-
        call record — outcome_reason: information_provided
      - >-
        call record — outcome: resolved
      - >-
        No TOOL_CALL between events 9 and 20.
    consequence: >-
      Any metric that reads the disposition counts this call as a success.
    detectable_by: assert
    tier: defect

  - id: HF-48
    call_ref: CALL-17
    owner: data
    observation: >-
      The delivery fields cannot be interpreted from the record. A sent state
      sits beside three attempts; the register declares both variable names
      and no vocabulary for their values, so whether sent is terminal, and
      whether the third attempt succeeded where two did not, cannot be read
      off. The channel is not recorded either: an email is implied by the
      agent's junk-folder suggestion and by the account email in the context,
      and no event states that email was the channel, or that any delivery
      receipt was requested or returned. No tool in the call reads delivery
      status.
    evidence:
      - >-
        context — delivery_state := sent
      - >-
        context — delivery_attempts := 3
      - >-
        event 10 — "Have a look in your junk folder."
      - >-
        No TOOL_CALL between events 9 and 20.
    consequence: >-
      Whatever the agent should have done, these two values were all it had.
    detectable_by: human
    tier: question

  - id: HF-49
    call_ref: CALL-17
    owner: data
    observation: >-
      The door time does not fit what the caller said. The context records
      doors at 19:00 UTC on the day after the call, the caller called it
      tomorrow night, and no venue timezone is in the record to settle what
      local time that is.
    evidence:
      - >-
        context — door_time := 2027-04-11T19:00:00Z
      - >-
        event 4 — "the show is tomorrow night"
    consequence: >-
      Either the door time was authored as a local time and labeled UTC, or
      the venue is somewhere the record does not say.
    detectable_by: human
    tier: question

  - id: HF-50
    call_ref: CALL-17
    owner: data
    observation: >-
      The record cannot account for the end of the call. The caller's last
      turn ends and the lifecycle event follows more than thirty seconds later
      with nothing recorded in between.
    evidence:
      - >-
        events 19 to 20 — the gap runs from 1:23.418 to 2:00.648
      - >-
        No event of any kind between events 19 and 20.
    consequence: >-
      Time the caller spent on the line is unattributable.
    detectable_by: assert
    tier: question

  - id: HF-51
    call_ref: CALL-21
    owner: agent
    observation: >-
      The agent unnecessarily disclosed account details to the caller. Before
      the transfer it read out the holder's name, the booking reference, the
      seat count and band, the date and both availability figures; the caller
      had supplied some of this and the agent volunteered the rest, to a
      caller verified by one ZIP. The same summary went to the specialist in
      the handoff argument, so reciting it aloud served nothing the handoff
      did not.
    evidence:
      - >-
        event 18 — "holder L. Marchetti, booking BK-3306-KT, two Balcony seats
        for May twenty-second"
      - >-
        context — account_holder_name := L. Marchetti
      - >-
        context — booking_reference := BK-3306-KT
    consequence: >-
      Values that could later serve to confirm a caller's identity were read
      aloud to whoever was on the line, to no purpose the handoff did not
      already serve.
    detectable_by: assert
    tier: defect

  - id: HF-52
    call_ref: CALL-21
    owner: agent
    observation: >-
      The agent said a group of this size must go through group sales, and
      that it could not set that up itself. Neither claim is grounded: no
      policy was fetched anywhere in the call, no tool result says it, and
      none of the register's three policy documents has a home for such a
      rule.
    evidence:
      - >-
        event 15 — "a group that size has to go through our group sales team,
        and I can't set that up from here"
      - >-
        No POLICY between events 1 and 23.
    consequence: >-
      Whether the escalation was required, and at what size, cannot be told
      from the call.
    detectable_by: judge
    tier: question

  - id: HF-53
    call_ref: CALL-21
    owner: agent
    observation: >-
      The agent promised a short wait for a transfer that nothing in the call
      can guarantee. The queue's depth is not in the record, the handoff had
      not been attempted when the promise was made, and no tool result carries
      an expected wait.
    evidence:
      - >-
        event 20 — "Putting you through now — stay on the line, it may take a
        moment."
      - >-
        event 22 — "t4 -> completed successful=true :: handoff_id=HO-4417;
        connected=true"
    consequence: >-
      A caller told to expect a moment may hang up when the wait runs longer.
    detectable_by: judge
    tier: question

  - id: HF-54
    call_ref: CALL-21
    owner: platform
    observation: >-
      The call's disposition reports a resolved call. The caller's request was
      handed to another team and nothing about the group booking was settled
      here, which the reason code itself records.
    evidence:
      - >-
        call record — outcome: resolved
      - >-
        call record — outcome_reason: escalated
      - >-
        event 22 — "t4 -> completed successful=true :: handoff_id=HO-4417;
        connected=true"
    consequence: >-
      Any metric that reads the disposition counts a handoff as a resolution.
    detectable_by: assert
    tier: defect

  - id: HF-55
    call_ref: CALL-21
    owner: agent
    observation: >-
      The agent said the numbers worked in the Mezzanine without addressing
      what the caller asked for, which was the rest of the choir on the same
      booking. The caller's two seats stay in the Balcony, so the party would
      sit in two bands, and the price difference between the bands was not
      raised.
    evidence:
      - >-
        event 4 — "Can I add the rest onto the same booking?"
      - >-
        event 14 — "t3 -> retrieved successful=true :: available=41"
      - >-
        event 15 — "The Mezzanine has forty-one, so the numbers work there"
      - >-
        event 17 — "No, those two stay exactly as they are."
    consequence: >-
      The caller was told their problem was solved in a band that seats the
      group apart from them, at a price nobody mentioned.
    detectable_by: judge
    tier: question

  - id: HF-56
    call_ref: CALL-21
    owner: platform
    observation: >-
      No state event records the handoff. The transfer completed with an
      identifier and a connected flag, and nothing in the record carries
      either forward.
    evidence:
      - >-
        event 22 — "t4 -> completed successful=true :: handoff_id=HO-4417;
        connected=true"
      - >-
        No STATE between events 9 and 23.
    consequence: >-
      The receiving team's own record of the handoff exists only inside one
      tool result.
    detectable_by: assert
    tier: defect
