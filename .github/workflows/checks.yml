name: checks

# The held-out set had no verification of any kind, while the main repository's
# `tools/verify_phase1.py` carried a caveat reading "that the five exist in the
# companion repository IS ASSERTED THERE, not here". It was asserted nowhere.
#
# This workflow is deliberately small. It does not evaluate the transcripts, it
# does not score them, and it holds no labels. It asserts three things a format
# change or an accidental commit would break, and one thing the freeze depends
# on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, because the verdict depends on a repository this one does not own.
  # Every step that reads a transcript runs against the harness's `main` as it
  # stands at run time, so a harness commit can turn this build red -- and until
  # 2026-09-11 nothing re-ran it when one did. The harness moved 98 commits past
  # the last green run here; its register edits staled one of the packet
  # builder's redactions and added two passages none of them covered; and the
  # checks written to notice sat green in the Actions history, because nothing
  # had asked them again.
  #
  # Two properties of `schedule` to know before relying on it. Failure
  # notifications go to whoever last edited the cron line, not to everyone with
  # access. And in a public repository, which this one is meant to become, GitHub
  # disables a scheduled workflow after 60 days without repository activity --
  # the same silence this trigger exists to end, so a quiet stretch needs a look.
  schedule:
    - cron: "17 6 * * *"

# Read-only by default, and one run per ref. Both siblings carry these and this
# workflow did not -- which matters more here than there: a token with write
# scope in a job that checks out a second repository is a wider blast radius
# than a token that can only read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the held-out set
        # Full history, because the phase-5 gate below reads commit trailers,
        # dates and ancestry, and a depth-1 clone holds one commit and none of it.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the harness alongside it
        # The default GITHUB_TOKEN is scoped to THIS repository and cannot read a
        # different private one, so this step failed silently on every run from
        # 2026-08-30 to 2026-09-06 -- and `continue-on-error` meant the build
        # stayed green while the parse check, and later the two ported checks,
        # never executed once. The workflow warned every time and nobody read it,
        # which is this project's own recurring shape found in the mechanism built
        # to prevent it.
        #
        # HARNESS_READ_TOKEN, a fine-grained token with Contents: read on the
        # harness and nothing else, is what fixed that. It went away on
        # 2026-09-21: the harness is public and the default token reads it.
        #
        # No `token:` is passed at all, and that is deliberate rather than
        # tidiness. A fallback naming the secret with `|| github.token` would
        # not fall back -- an expired secret is still a non-empty string, so it
        # would be passed, and a checkout needing no token would fail on a dead
        # one. Naming no token cannot fail that way.
        #
        # This step therefore reads no secret, which the README states in those
        # words: test_every_secret_the_workflow_reads_is_documented checks that
        # the absence is written down, because a `token:` line dropped by
        # accident looks exactly like one removed on purpose.
        #
        # `continue-on-error` stays, deliberately: the guard below reports "the
        # checks did not run" in the workflow's own words, which is a clearer
        # failure than a raw checkout error.
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: hmbseaotter/voice-agent-eval-harness
          path: .harness
          # History and tags, because the gate resolves rubric-frozen-v1 and
          # archives the frozen commit, and a depth-1 checkout fetches neither.
          fetch-depth: 0

      - name: Every transcript is named as one, and there is at least one
        # **This enumerated the members until 2026-09-07** -- a count of six and
        # a literal `for n in 13 14 15 16 17 21`. D83 knew the hazard and stated
        # it as a duty: "adding a sixth must update that step rather than
        # suppress it". A step that has to be edited whenever the set grows is
        # the shape this project has now repaired in five documents, and there
        # is no reason for the one enforcement point to keep it.
        #
        # Membership is checked against `HELDOUT_SET` below, which is the
        # declaration and the only thing entitled to say who the members are.
        # This step holds what can be held without it: the files are named like
        # transcripts, and the directory is not empty -- so a set that lost every
        # member fails here rather than passing an emptier comparison later.
        run: |
          set -eu
          found=$(git ls-files 'transcripts/CALL-*.txt' | wc -l)
          test "$found" -gt 0 || { echo "no transcripts are tracked"; exit 1; }
          bad=$(git ls-files transcripts | grep -Ev '^transcripts/CALL-[0-9]{2}\.txt$' || true)
          if [ -n "$bad" ]; then
            echo "::error::files under transcripts/ that are not named as transcripts:"
            echo "$bad"
            exit 1
          fi
          echo "$found transcripts, every one named CALL-NN.txt"

      - name: This repository tracks exactly what it is supposed to track
        # The real guard here. D21 withholds the labels until after
        # `rubric-frozen-v1`, and "the labels do not exist yet" was a promise
        # rather than a check.
        #
        # **This was a denylist and it was two things wrong.** It globbed
        # `labels* label-* *labels*.json *labels*.yaml` **in the repository root
        # only**, so `transcripts/CALL-13.labels.yaml` passed it; and it matched
        # on names, so `gold.yaml`, `annotations/` and `ground_truth.md` passed
        # it too. A guard against a file nobody has written yet cannot work by
        # guessing what it will be called.
        #
        # Inverted to an allowlist over **tracked** files. Anything that is not
        # on this list fails the build, whatever it is called and wherever it
        # sits -- labels, a stray authoring packet, a scratch note. Shorter,
        # stronger, and it cannot be defeated by a rename.
        run: |
          set -eu
          expected=$(printf '%s\n' \
            .gitattributes \
            .github/workflows/checks.yml \
            .gitignore \
            CORPUS_VERSION \
            LICENSE \
            NAMES \
            PERSONAS \
            PHASE-5-LABELS.md \
            README.md \
            ruff.toml \
            tests/test_holdout_conventions.py \
            tests/test_label_chain.py \
            tests/test_label_findings.py \
            tests/test_label_worksheet.py \
            tests/test_review_folder.py \
            tests/test_validate_labels.py \
            tools/build_authoring_packet.py \
            tools/build_review_folder.py \
            tools/declare_names.py \
            tools/declare_personas.py \
            tools/label_gate.py \
            tools/label_manifest.py \
            tools/make_label_findings.py \
            tools/make_label_worksheet.py \
            tools/validate_labels.py \
            | sort)
          transcripts=$(git ls-files 'transcripts/CALL-*.txt' | sort)
          test -n "$transcripts" || { echo "no transcripts are tracked"; exit 1; }
          # labels/ and runs/ are left out here and checked by the phase-5 gate
          # step below instead, which admits their files only in the order
          # PHASE-5-LABELS.md §7 sets. A file anywhere else is still refused.
          actual=$(git ls-files | grep -Ev '^(labels|runs)/' | sort)
          allowed=$(printf '%s\n%s\n' "$expected" "$transcripts" | sort)
          if ! diff -u <(echo "$allowed") <(echo "$actual"); then
            echo "::error::this repository tracks a file that is not on the allowlist above."
            echo "::error::Labels and run logs belong under labels/ and runs/, which the gate checks."
            echo "::error::If it is something else, add it to the list in this workflow first."
            exit 1
          fi
          echo "tracked files outside labels/ and runs/ are exactly the allowlist"

      - name: HELDOUT_SET in the harness matches the transcripts here
        # The standing duty in the harness's `HOLDOUT-OBLIGATIONS.md`: that file
        # is a manual mirror of this directory, kept in a repository that cannot
        # see this one. This is the only place both sides are visible, so it is
        # the only place the mirror can be checked -- and identifiers are
        # metadata, which is why the harness may hold them at all.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          declared=$(grep -v '^[[:space:]]*#' .harness/HELDOUT_SET | grep -v '^[[:space:]]*$' \
            | tr -d '[:blank:]' | sort)
          actual=$(git ls-files 'transcripts/CALL-*.txt' | xargs -n1 basename | sed 's/\.txt$//' \
            | sort)
          if ! diff -u <(echo "$declared") <(echo "$actual"); then
            echo "::error::HELDOUT_SET in the harness does not match the transcripts here."
            echo "::error::It is a manual mirror and it has gone stale -- update it there."
            exit 1
          fi
          echo "HELDOUT_SET matches this directory"

      - name: Set up Python
        if: hashFiles('.harness/pyproject.toml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Every transcript parses under the harness's current adapter
        # Conditional, and it says so: the harness is a separate repository, and
        # a rename, a revert to private or a network fault would stop this step
        # running. Stating the condition is the fix applied to the same shape
        # in the harness's own workflow.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          python -m pip install --quiet ./.harness
          python - <<'PY'
          from pathlib import Path
          from harness.corpus.text_adapter import parse_call

          problems = []
          for path in sorted(Path("transcripts").glob("CALL-*.txt")):
              call = parse_call(path)
              if call.unparsed:
                  problems += [f"{path.name}:{u.line_number}: {u.reason}" for u in call.unparsed]
              print(f"{call.record.call_id}: {len(call.events)} events, {len(call.unparsed)} unparsed")
          if problems:
              raise SystemExit("unparsed lines:\n  " + "\n  ".join(problems))
          PY

      - name: The conventions the harness enforces and this repository could not
        # Ported from the harness's `tests/test_corpus_hygiene.py`, which globs
        # `corpus/transcripts/` and so had never run against these five. Both
        # conventions were settled on 2026-09-01 and these transcripts predate
        # that, which is the whole of why `HOLDOUT-OBLIGATIONS.md` exists.
        #
        # Conditional on the same thing as the step above, for the same reason:
        # the provenance check needs the parser and the clause-count check needs
        # the harness's `corpus/policies/`.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          python -m pip install --quiet pytest
          HARNESS_ROOT=.harness python -m pytest tests -v

      - name: The persona declaration is current
        # `PERSONAS` is generated, not written. Without this step it is a file
        # somebody has to remember to regenerate, which is the class of failure
        # `HOLDOUT-OBLIGATIONS.md` exists to record -- and a persona used and
        # undeclared silently narrows every check keyed to the list.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          python tools/declare_personas.py --check

      - name: The name declaration is current
        # `NAMES` is generated for the reason `PERSONAS` is. A name this set starts
        # using that the harness register does not declare under its kind fails
        # here until the file is regenerated and the addition committed, which is
        # the deliberate act D101 asks of a new name.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          python tools/declare_names.py --check

      - name: The phase-5 label chain holds in this repository's history
        # PHASE-5-LABELS.md §7. The files under labels/ and runs/ are admitted
        # only in order: a manifest citing the freeze, a run log citing the
        # manifest, then the plaintext citing the run and recomputing to what
        # was sealed. Until something is sealed, this asserts that nothing is.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          HARNESS_ROOT=.harness python tools/label_gate.py

      - name: Lint, format and type-check this repository's own Python
        # There was no gate of any kind until 2026-09-07, and no configuration
        # either -- so ruff's defaults applied and the only honest description
        # of the lint state was that nobody had ever run it. Under the harness's
        # own settings this repository had 12 findings, one file that would be
        # reformatted, and a strict-mypy error in the "verbatim" copy of
        # `_sourced_by`, which had dropped its parameter annotations. That last
        # one is the interesting one: the copy was failing the type check *of
        # the thing it claims to be a copy of*.
        #
        # `ruff.toml` mirrors the harness's configuration, so "held to the
        # harness's standards" is a file rather than a sentence in a brief.
        if: hashFiles('.harness/pyproject.toml') != ''
        run: |
          set -eu
          python -m pip install --quiet ruff mypy
          ruff check .
          ruff format --check .
          mypy --strict --ignore-missing-imports tests tools

      - name: Fail when the harness was not available
        # This was a warning, and the warning is precisely what let this repository
        # report success for a week while asserting almost nothing. Every check
        # that reads a transcript is conditional on the harness being checked out;
        # without it this job has verified that five files exist and that none is
        # named like a label set, and nothing whatever about their contents. That
        # is not what a green tick claims.
        #
        # It is also the failure mode that returns. A rename, a revert to private
        # or a network fault sends the conditional steps quiet again. This step
        # is what turns that silent reversion into a red build, which is the whole
        # difference between a promise and a check.
        if: hashFiles('.harness/pyproject.toml') == ''
        run: |
          echo "::error::the harness repository was not checked out, so every step conditional"
          echo "::error::on .harness/pyproject.toml was skipped: the parse check, the ported"
          echo "::error::conventions, the persona and name declarations, the phase-5 label gate,"
          echo "::error::and the lint, format and type checks. This job has verified nothing"
          echo "::error::about transcript contents. Check that hmbseaotter/voice-agent-eval-harness"
          echo "::error::is still public and still named that. If it is private again, the checkout"
          echo "::error::step needs a token with Contents: read on it."
          exit 1
